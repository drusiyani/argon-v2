name: Tests
on:
  push:
    paths: ["engine/**", "research/*.py", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
concurrency:
  group: argon-v2-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest
      - run: pytest -q tests/
