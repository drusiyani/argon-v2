name: Tests
on:
  push:
    paths: ["engine/**", "research/*.py", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
concurrency:
  group: argon-v2-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Private market data (argon-data)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$DATA_TOKEN" ]; then
            git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/argon-data
            for d in databento lockbox2010 extra; do if [ -d /tmp/argon-data/$d ]; then mkdir -p data/$d && cp -n /tmp/argon-data/$d/* data/$d/; fi; done; echo "private data loaded"
          else echo "no DATA_TOKEN yet: using the data in this repo"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest
      - run: pytest -q tests/
