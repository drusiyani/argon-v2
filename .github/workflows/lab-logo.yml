name: lab-logo (one-off)
on:
  push:
    paths: ['.github/workflows/lab-logo.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap brand mark and add favicon in lab.html
        run: |
          python3 - <<'EOF'
          import re
          p='docs/lab.html'; s=open(p).read()
          if 'logo.png' not in s:
              i=s.index('<a class="brand')
              m=re.compile(r'<svg viewBox="0 0 32 32"[^>]*>.*?</svg>',re.S).search(s,i)
              s=s[:m.start()]+'<img src="logo.png" alt="" width="26" height="26">'+s[m.end():]
              s=re.sub(r'(<title>.*?</title>)',r'\1<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">',s,count=1)
              s=s.replace('.brand svg{color:var(--gold)}','.brand svg{color:var(--gold)}.brand img{width:26px;height:26px;border-radius:50%;display:block}',1)
              open(p,'w').write(s)
          EOF
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add docs/lab.html; git diff --cached --quiet || git commit -m "Lab page: star logo and favicon"; git push
