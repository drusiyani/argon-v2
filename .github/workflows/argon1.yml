name: Argon-1 training
# Trains Argon-1 (research/ARGON1_PLAN.md, Amendment 15) on the private Databento data, one stage per run or all at once.
# Private outputs (features, Kronos summaries, weights) are pushed to the private argon-data repo under argon1/.
# Only metrics and fingerprints are committed here, in research/results/argon1_*.json.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "features | embed | select | test (once only) | refit | build (features+embed+select)"
        required: true
        default: build
      version:
        description: "model name for refit"
        default: argon1
      end:
        description: "last day used by refit"
        default: "2026-10-31"
permissions:
  contents: write
concurrency:
  group: argon1
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ARGON1_DIR: /tmp/argon-data/argon1
      KRONOS_DIR: /tmp/Kronos
      PYTHONHASHSEED: "7"
    steps:
      - uses: actions/checkout@v4
      - name: Private market data (argon-data)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/argon-data
          for d in databento lockbox2010; do mkdir -p data/$d && cp -n /tmp/argon-data/$d/* data/$d/; done
          mkdir -p /tmp/argon-data/argon1; echo "private data loaded"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries (pinned) and Kronos at a fixed commit
        run: |
          pip install --quiet torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==2.5.3 pandas==3.0.5 scikit-learn==1.9.1 huggingface_hub==2.4.0 einops==0.8.2 safetensors==0.8.0 tqdm   # the versions the dry run used
          git clone -q https://github.com/shiyu-coder/Kronos.git /tmp/Kronos && git -C /tmp/Kronos checkout -q 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - name: Train
        run: |
          S="${{ github.event.inputs.stage }}"
          if [ "$S" = "build" ]; then
            [ -f $ARGON1_DIR/features.npz ] || python research/argon1/train.py features
            [ -f $ARGON1_DIR/kronos_emb.npz ] || python research/argon1/train.py embed
            python research/argon1/train.py select
          elif [ "$S" = "refit" ]; then
            python research/argon1/train.py refit --version "${{ github.event.inputs.version }}" --end "${{ github.event.inputs.end }}"
          else
            python research/argon1/train.py "$S"
          fi
      - name: Save private outputs to argon-data
        if: always()
        run: |
          cd /tmp/argon-data && git config user.name argon-bot && git config user.email argon-bot@users.noreply.github.com
          git add argon1 && (git diff --cached --quiet || git commit -qm "argon1: ${{ github.event.inputs.stage }}") && git push -q || echo "nothing to save"
      - name: Commit metrics
        if: always()
        run: |
          git config user.name argon-bot; git config user.email argon-bot@users.noreply.github.com
          for f in research/results/argon1_*.json research/results/*_frozen.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -qm "argon1: ${{ github.event.inputs.stage }} results" && git pull -q --rebase -X theirs origin main && git push -q)
