name: Argon v2 farm

on:
  schedule:
    - cron: "30 22 * * 1-5"   # every weekday after the US close: save tape, run the farm, rebuild the site
    - cron: "0 6 2 * *"       # 2nd of each month: add last month's 1-minute data and re-pick the rules
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, monthly or backfill"
        default: "daily"

permissions:
  contents: write

concurrency:
  group: argon-v2-writer      # the farm and the desk take turns, so they never save over each other
  cancel-in-progress: false

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # the first backfill on years of real futures can take a while
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out the mode
        id: mode
        env:
          HAS_DATABENTO: ${{ secrets.DATABENTO_API_KEY != '' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          if [ "${{ github.event.schedule }}" = "0 6 2 * *" ]; then MODE=monthly; fi
          if [ ! -f data/bt_out.json ]; then MODE=backfill; fi
          # first run after the Databento key is added: download the real futures history and redo every test on it
          if [ "$HAS_DATABENTO" = "true" ] && [ -z "$(ls data/databento/*.csv.gz 2>/dev/null)" ]; then MODE=backfill; fi
          echo "Running in $MODE mode"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Save today's tape (and 1-minute history when needed)
        run: python engine/fetch_data.py ${{ steps.mode.outputs.mode }}
      - name: Real futures history from Databento (only if the secret is set)
        if: steps.mode.outputs.mode != 'daily'
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python engine/fetch_databento.py ${{ steps.mode.outputs.mode == 'monthly' && 'monthly' || '' }}
      - name: Long backtest and monthly re-pick
        if: steps.mode.outputs.mode != 'daily'
        run: |
          python engine/checks.py   # stops the run if the data's clock is wrong
          LAB_WINDOWS=london python engine/lab.py   # v0.9: the main strategy trades the London session only
          python engine/extra.py
          python engine/dump_setups.py
          python engine/mistakes.py
          python engine/stats.py
      - name: Run the farm
        run: python engine/farm.py
      - name: Build the site
        run: python engine/build_site.py
      - name: Grow the brain (Obsidian vault)
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          python engine/brain.py
      - name: Claude's weekly reflection and the research scout (Fridays, only if the API key secret is set)
        if: github.event.schedule == '30 22 * * 1-5'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "5" ]; then python engine/reflect.py; python engine/agents_reflect.py; python engine/scout.py || echo "scout skipped"; fi
      - name: Keep a safety copy of the Databento download (so a failed save never costs credit twice)
        if: steps.mode.outputs.mode != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: databento-${{ github.run_id }}
          path: data/databento/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit
        run: |
          git config user.name "argon-bot"
          git config user.email "argon-bot@users.noreply.github.com"
          for p in data docs vault; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "farm: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%d)"
          git stash --include-untracked >/dev/null 2>&1 || true      # leftovers must not block catching up
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then echo "saved"; exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "someone else saved first, catching up and retrying ($i)"; sleep $((i*15))
          done
          exit 1
