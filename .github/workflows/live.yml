name: Argon v2 live book (nightly ledger)

# The OFFICIAL paper book (engine/live.py): after the close, top up Databento 1-minute data, then book every finished session
# since the last run into the hash-chained ledger. Two schedules because GitHub often starts cron jobs hours late; missed
# days are caught up automatically, and running twice never books a day twice.
on:
  schedule:
    - cron: "15 22 * * 1-5"     # after the US close
    - cron: "30 2 * * 2-6"      # backup, in case the first one was very late or failed
  workflow_dispatch:
    inputs:
      book:
        description: "practice or official (blank = by date)"
        default: ""

permissions:
  contents: write

concurrency:
  group: argon-v2-writer        # shares the farm's lane, so they never save over each other
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Private market data (argon-data)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$DATA_TOKEN" ]; then
            git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/argon-data
            if [ -d /tmp/argon-data/databento ]; then mkdir -p data/databento && cp -n /tmp/argon-data/databento/* data/databento/; echo "private data loaded"; fi
          else echo "no DATA_TOKEN yet: using the data in this repo"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Top up Databento data (pennies)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python engine/fetch_live.py
      - name: Save new market data to the private repo
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$DATA_TOKEN" ] && [ -d /tmp/argon-data ]; then
            mkdir -p /tmp/argon-data/databento && cp -n data/databento/*.csv.gz /tmp/argon-data/databento/ 2>/dev/null || true
            cd /tmp/argon-data && git config user.name argon-bot && git config user.email argon-bot@users.noreply.github.com
            git add -A && (git diff --cached --quiet || (git commit -qm "data: $(date -u +%Y-%m-%d)" && git push -q))
          fi
      - name: Book the finished sessions (kill switch, chain, replay, data gate, positions)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python engine/live.py ${{ github.event.inputs.book }}
      - name: Public timestamp of the ledger (OpenTimestamps)
        run: |
          pip install -q opentimestamps-client || true
          python engine/stamp.py || echo "stamp skipped"
      - name: Cross-check prices with a second source
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python engine/price_check.py || echo "price check skipped"
      - name: Plain-English daily summary for the desk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python engine/daily_summary.py || echo "summary skipped"
      - name: Brain notes (one per trading day, monthly pages, Decisions)
        run: |
          python engine/brain_notes.py || echo "brain notes skipped"
      - name: Weekly report into the vault (Friday night and Saturday)
        run: |
          if [ "$(date -u +%u)" -ge 5 ]; then python engine/weekly_report.py; fi
      - name: Alert if anything failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python engine/alert.py "Argon - nightly book run failed" "Run ${{ github.run_id }} failed or halted. Check data/ledger*/status.json." high
      - name: Commit (always, so a halt is published too)
        if: always()
        run: |
          git config user.name "argon-bot"
          git config user.email "argon-bot@users.noreply.github.com"
          for p in data/databento data/ledger data/ledger_practice data/stamps data/price_check.json data/alerts.jsonl docs/data/ledger.json docs/data/daily_summary.json vault/Live; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "ledger: $(date -u +%Y-%m-%d)"
          git stash --include-untracked >/dev/null 2>&1 || true
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then echo "saved"; exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "someone else saved first, retrying ($i)"; sleep $((i*15))
          done
          exit 1
