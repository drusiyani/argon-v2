name: Argon v2 desk (morning call, council, Kronos, live view)

# GitHub only ran the old every-15-minutes schedule about twice a day, so fresh setups (under 30 minutes old) were never
# judged. Now each run starts before a session and STAYS ALIVE, checking every 5 minutes until the session ends.
on:
  schedule:
    # GitHub often starts scheduled runs hours late (4 hours on 2 Nov), so the runs start early and overlap: each stays alive
    # for ~5h40m. The 10:00 UTC run covers the 8:45-9:25am New York morning call even if it starts up to ~4 hours late.
    - cron: "0 5 * * 1-5"      # London morning
    - cron: "0 10 * * 1-5"     # covers the New York pre-open morning call
    - cron: "0 15 * * 1-5"     # New York afternoon to the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argon-v2-desk          # its own lane; it only writes desk files and rebases onto everyone else's saves
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Private market data (argon-data)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$DATA_TOKEN" ]; then
            git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/argon-data
            for d in databento lockbox2010 extra; do if [ -d /tmp/argon-data/$d ]; then mkdir -p data/$d && cp -n /tmp/argon-data/$d/* data/$d/; fi; done; echo "private data loaded"
          else echo "no DATA_TOKEN yet: using the data in this repo"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kronos-small setup (free CPU)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pandas huggingface_hub einops safetensors tqdm
          [ -d vendor/Kronos ] || git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos
      - name: Watch the session (every 5 minutes)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name "argon-bot"; git config user.email "argon-bot@users.noreply.github.com"
          end=$((SECONDS + 340*60)); i=0
          while [ $SECONDS -lt $end ]; do
            H=$(date -u +%H)
            if [ "$H" -ge 21 ]; then echo "session over"; break; fi
            python engine/fetch_data.py || echo "prices skipped"
            if [ $((i % 3)) -eq 0 ]; then python engine/kronos.py || echo "Kronos skipped"; fi
            python engine/daytype.py || echo "day-type forecast failed"      # only acts 8:45-9:25 New York, once a day
            python engine/daytype_score.py || echo "day-type score skipped"
            python engine/live_view.py || echo "live view skipped"     # UNOFFICIAL: same book code on Yahoo bars
            python engine/desk_feed.py || echo "feed skipped"
            for p in data/desk_calls.jsonl data/agent_memory data/kronos.json data/daytype.jsonl data/daytype_score.json docs/desk_feed.json docs/data/live_view.json data/alerts.jsonl; do [ -e "$p" ] && git add -A "$p"; done
            if ! git diff --cached --quiet; then
              git commit -m "desk: $(date -u +%H:%M)" -q
              git stash --include-untracked -q 2>/dev/null || true
              for k in 1 2 3 4 5; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep $((k*10)); done
              git stash drop -q 2>/dev/null || true
            else
              git stash --include-untracked -q 2>/dev/null && git stash drop -q 2>/dev/null; git pull --rebase -q origin main || true
            fi
            i=$((i+1)); sleep 300
          done
