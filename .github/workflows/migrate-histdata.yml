name: One-time move of HistData files to the private repo

# HistData.com publishes no licence, so its files must not sit in the public repo (same pattern as Databento).
# Copies data/histdata into drusiyani/argon-data, checks every copy by sha256, then writes the public
# data/histdata/MANIFEST.json (names, sizes, hashes). The manifest appearing in argon-v2 is the signal that the copy
# is safe and the raw files can be deleted from the public repo. Delete this workflow after that.
on:
  push:
    paths: ['.github/workflows/migrate-histdata.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argon-v2-writer
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy to argon-data and verify
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          test -n "$DATA_TOKEN" || { echo "Add the DATA_TOKEN secret first"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/argon-data
          mkdir -p /tmp/argon-data/histdata
          for f in data/histdata/*; do case "$f" in *MANIFEST.json) continue;; esac; cp "$f" /tmp/argon-data/histdata/; done
          (cd /tmp/argon-data && git config user.name argon-bot && git config user.email argon-bot@users.noreply.github.com &&
           git add -A && (git diff --cached --quiet || git commit -qm "HistData files moved from argon-v2 (no public licence)") && git push -q)
          # verify against a fresh clone, so we check what GitHub actually stored
          rm -rf /tmp/check && git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/drusiyani/argon-data.git" /tmp/check
          python3 - <<'PY'
          import os, json, hashlib, datetime as dt
          src = 'data/histdata'; dst = '/tmp/check/histdata'; files = {}
          for n in sorted(os.listdir(src)):
              if n == 'MANIFEST.json': continue
              h = hashlib.sha256(open(os.path.join(src, n), 'rb').read()).hexdigest()
              h2 = hashlib.sha256(open(os.path.join(dst, n), 'rb').read()).hexdigest()
              assert h == h2, f'{n}: copy does not match'
              files[n] = dict(bytes=os.path.getsize(os.path.join(src, n)), sha256=h)
          json.dump(dict(source='HistData.com 1-minute bars (free download). Raw files are in the private repo drusiyani/argon-data '
                         'because HistData publishes no licence to redistribute them. Download your own copies from histdata.com and '
                         'check them with: python engine/verify_data.py', saved=dt.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),
                         files=files), open(os.path.join(src, 'MANIFEST.json'), 'w'), indent=1)
          print('verified', len(files), 'files')
          PY
      - name: Publish the manifest
        run: |
          git config user.name argon-bot; git config user.email argon-bot@users.noreply.github.com
          git add data/histdata/MANIFEST.json; git commit -qm "HistData manifest (files now in the private repo)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; exit 1
