name: Download lockbox 2010-2020 (once)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: argon-v2-writer
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python engine/fetch_lockbox.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      - name: Save whatever verified (runs even if a file failed)
        if: always()
        run: |
          git config user.name "argon-bot"; git config user.email "argon-bot@users.noreply.github.com"
          git add data/lockbox2010
          git diff --cached --quiet && exit 0
          git commit -m "lockbox: 2010-2020 NQ + ES 1-minute data (verified, unopened)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*10)); done; exit 1
