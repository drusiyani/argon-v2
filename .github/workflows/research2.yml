name: Argon v2 research round 2
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (Jul 2021-Sep 2026) or lockbox (2011-2020, ONCE)"
        default: "test"
permissions:
  contents: write
concurrency:
  group: argon-v2-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/run2.py ${{ github.event.inputs.mode == 'lockbox' && 'lockbox' || '' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "argon-bot"; git config user.email "argon-bot@users.noreply.github.com"
          git add -A research/results
          git diff --cached --quiet && exit 0
          git commit -m "research round 2: ${{ github.event.inputs.mode || 'test' }} results"
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep $((i*15)); done; exit 1
