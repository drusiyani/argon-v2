<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argon desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0A0A0A;--line:#262626;--ink:#EDEDED;--quiet:#8F8F8F;--gold:#E6B54A;--up:#3FCF8E;--down:#F25F5C;color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#000;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#c.drag{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;pointer-events:none;z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:-.01em}.brand .sl{color:#3a3a3a;font-weight:300;font-size:20px}.brand .pj{color:var(--quiet);font-weight:500}
.brand svg{width:22px;height:22px}
.badge{border:1px solid var(--line);color:var(--quiet);font:500 11px Geist Mono,monospace;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}.badge i{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(63,207,142,.6);animation:pl 2s infinite}@keyframes pl{70%{box-shadow:0 0 0 6px rgba(63,207,142,0)}}
.pill{margin-left:auto;border:1px solid var(--line);background:rgba(10,10,10,.9);border-radius:8px;padding:7px 12px;font:500 16px Geist Mono,monospace;letter-spacing:-.02em;pointer-events:auto}
.pill .d{color:var(--up);font-size:14px;margin-left:8px}.pill .d.neg{color:var(--down)}
.pill small{display:block;font-size:10px;color:var(--quiet);letter-spacing:.04em;margin-top:-2px}
.clock{flex-basis:100%;color:var(--quiet);font:12px Geist Mono,monospace}
.zoom{position:fixed;right:16px;top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.zoom{gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a0a0a}.zoom button{width:40px;height:36px;border-radius:0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.zoom button:last-child{border-bottom:0}.zoom button:hover{background:#111}
.cap{position:fixed;left:16px;right:16px;max-width:420px;bottom:calc(var(--sheet,260px) + 16px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.96);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);z-index:2;display:none}
.cap b{color:var(--c,var(--gold));font-weight:500}
.sheet{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:rgba(10,10,10,.97);border:1px solid var(--line);border-radius:10px;z-index:2;box-shadow:0 8px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:min(42vh,360px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;cursor:pointer;user-select:none}
.sheet header h2{margin:0;font-size:13px;font-weight:500;color:var(--ink)}.sheet header h2 b{color:var(--quiet);font:500 11px Geist Mono,monospace;margin-left:8px;border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.sheet header .chev{margin-left:auto;color:var(--quiet);transition:transform .2s}.sheet.min .chev{transform:rotate(180deg)}
.tabs{display:flex;gap:2px;margin:0 14px 10px;padding:2px;border:1px solid var(--line);border-radius:8px;width:max-content}.tabs button{font:inherit;font-size:12px;padding:4px 12px;border-radius:6px;border:0;background:transparent;color:var(--quiet);cursor:pointer}
.tabs button.on{background:#1f1f1f;color:var(--ink)}
.body{overflow:auto;padding:0 14px 10px;flex:1;min-height:0}
.sheet.min .tabs,.sheet.min .body,.sheet.min .rooms{display:none}
.log{list-style:none;margin:0;padding:0}.log li{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);animation:in .35s ease}
.log time{color:var(--quiet);font:12px Geist Mono,monospace}.log .r{font:500 12px Geist Mono,monospace}.log .m{grid-column:2;color:#a1a1a1}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.kv span{display:block;color:var(--quiet);font-size:12px}
.kv b{font:500 16px Geist Mono,monospace}
.tr{display:grid;grid-template-columns:1fr auto;padding:7px 0;border-top:1px solid var(--line)}.tr .q{color:var(--quiet);grid-column:1/3;font-size:11px}
.rooms{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 12px;border-top:1px solid var(--line);scrollbar-width:none}.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:none;font:500 11px Geist Mono,monospace;padding:5px 10px 5px 8px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--quiet);cursor:pointer;display:flex;align-items:center;gap:6px}.rooms button::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.rooms button.on{background:#1a1a1a;color:var(--ink);border-color:#3a3a3a}
.note{color:var(--quiet);font-size:11px;padding:6px 0 2px}
@media (max-width:640px){.sheet{max-height:30vh}.sheet .tabs{padding-bottom:6px}.pill{font-size:15px}.zoom{top:calc(132px + env(safe-area-inset-top,0px))}.zoom button{width:40px;height:36px}}
@media (prefers-reduced-motion:reduce){.log li{animation:none}}
.dh{font:500 11px Geist Mono,monospace;color:var(--quiet);padding:10px 0 4px;letter-spacing:.04em}.uo{color:var(--gold);border:1px solid #3a3020;border-radius:99px;padding:0 6px;margin-left:6px;font-size:10px}
.tr2{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:7px 0;cursor:pointer}.tr2:hover{background:#0f0f0f}.tr2 .q{color:var(--quiet);grid-column:1/3;font-size:11px}
.sum{margin:4px 0 8px;color:#cfcfcf;line-height:1.55}.back{font:inherit;font-size:12px;color:var(--quiet);background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;margin-top:6px}
.spark{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;background:#050505;margin:4px 0}
.rp{display:flex;gap:6px;margin:8px 0}.rp select,.rp button{font:inherit;font-size:12px;color:var(--ink);background:#111;border:1px solid var(--line);border-radius:8px;padding:5px 10px}.rp select{flex:1}
#rps{width:100%;accent-color:var(--gold)}.rpl{display:flex;justify-content:space-between;color:var(--quiet);font:11px Geist Mono,monospace}.rpl b{color:var(--ink)}
.tabs{overflow-x:auto;max-width:calc(100% - 28px);scrollbar-width:none}
@media (max-width:640px){.top{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0}.brand{font-size:13px}.pill{padding:5px 10px;font-size:14px}.clock{font-size:11px}
 .sheet{left:8px;right:8px;width:auto;max-height:46vh;bottom:calc(8px + env(safe-area-inset-bottom,0px))}.cap{left:8px;right:8px;max-width:none;font-size:12px}.zoom{right:10px}.zoom button{width:36px;height:32px}}
.embedded .sheet{bottom:calc(92px + env(safe-area-inset-bottom,0px))}@media (min-width:821px){.embedded .sheet{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<canvas id="c" aria-label="Argon office map: each room is part of the desk, bots at their desks, messages moving between rooms"></canvas>
<div class="top">
 <div class="brand"><svg viewBox="0 0 32 32"><path d="M5 15a11 11 0 0 1 22 0v13l-3.7-2.6L19.6 28 16 25.4 12.4 28l-3.7-2.6L5 28z" fill="#F4F1EA"/><ellipse cx="12" cy="14" rx="2.3" ry="3.1" fill="#0b0b0b"/><ellipse cx="20" cy="14" rx="2.3" ry="3.1" fill="#0b0b0b"/></svg>Argon<span class="sl">/</span><span class="pj">desk</span></div>
 <span class="badge" id="badge"><i></i>Loading…</span><a href="./" target="_top" style="pointer-events:auto;color:var(--quiet);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:2px 10px">← back to Argon</a>
 <div class="pill"><span id="val">$100,000.00</span><span class="d" id="dv"></span><small id="pillnote">paper account</small></div>
 <div class="clock" id="clock"></div>
</div>
<div class="zoom"><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button><button id="fit" style="font-size:12px">Fit</button></div>
<div class="cap" id="cap"></div>
<section class="sheet" id="sheet">
 <header id="sh"><h2 id="sht">COMMS LOG<b id="shn">0</b></h2><span class="chev">⌃</span></header>
 <div class="tabs"><button class="on" data-t="log">Live</button><button data-t="trades">Trades</button><button data-t="summary">Summary</button><button data-t="replay">Replay</button></div>
 <div class="body" id="body"><ul class="log" id="log"></ul></div>
 <div class="rooms" id="rooms"></div>
</section>
<script>
"use strict";
// ================= the building =================
const BOT={
 Chief:{d:'M5 15a11 11 0 0 1 22 0v13l-3.7-2.6L19.6 28 16 25.4 12.4 28l-3.7-2.6L5 28z',f:'#F4F1EA',e:[[12,14],[20,14]]},
 // the four strategies
 Quant:{d:'M16 4l11 6v12l-11 6-11-6V10z',f:'#F2C14E',e:[[12.4,15.5],[19.6,15.5]]},
 Noise:{d:'M16 6c6.6 0 11 4.6 11 10.6 0 6.4-4.6 10.4-11 10.4S5 23 5 16.6C5 10.6 9.4 6 16 6z',f:'#5ED0E6',e:[[12,16],[20,16]],ant:1},
 Atr:{d:'M16 4.5c1 0 1.9.5 2.4 1.4l9.2 16.5c1 1.8-.3 4.1-2.4 4.1H6.8c-2.1 0-3.4-2.3-2.4-4.1l9.2-16.5c.5-.9 1.4-1.4 2.4-1.4z',f:'#FF6B95',e:[[13,19],[19,19]],er:[2,2.7]},
 Expiry:{d:'M9 6h14a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z',f:'#9B8FE0',e:[[12,15.5],[20,15.5]],brow:1},
 // the morning-call council: original designs, no company logos
 Claude:{d:'M8 7h16a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5v-9a5 5 0 0 1 5-5z',f:'#E8876A',e:[[12,16],[20,16]]},
 Gemini:{d:'M16 3.5l12 12.5-12 12.5L4 16z',f:'#7FA6FF',e:[[12.6,15.5],[19.4,15.5]],er:[2,2.6]},
 Llama:{d:'M9 4h3v5h8V4h3v6a6 6 0 0 1 4 5.7V24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-8.3A6 6 0 0 1 9 10z',f:'#C9A27A',e:[[12.4,17],[19.6,17]]},
 Gpt:{d:'M16 7a9 9 0 1 1 0 18 9 9 0 0 1 0-18z',f:'#4FD1A5',e:[[12.6,15.5],[19.4,15.5]],legs:1},
 // desk staff
 Risk:{d:'M16 4l10.4 6v12L16 28 5.6 22V10z',f:'#F59A3E',e:[[12.4,15.5],[19.6,15.5]]},
 Size:{d:'M10 9h12a7 7 0 0 1 0 14H10a7 7 0 0 1 0-14z',f:'#FFB4C8',e:[[11.5,16],[20.5,16]]},
 Fills:{d:'M10 9h12a7 7 0 0 1 0 14H10a7 7 0 0 1 0-14z',f:'#4FD18B',e:[[11.5,16],[20.5,16]]},
 Filter:{d:'M5.5 6h21c1.4 0 2.1 1.6 1.2 2.7L19.5 18v7.4c0 .8-.5 1.4-1.2 1.7l-3 1.2c-.9.4-1.8-.3-1.8-1.2V18L4.3 8.7c-.9-1.1-.2-2.7 1.2-2.7z',f:'#6C9BF2',e:[[12.6,11.5],[19.4,11.5]],er:[2,2.6]}};
for(const b of Object.values(BOT))b.p=new Path2D(b.d);
// eight rooms on a 3x3 diamond (cell centres 6.2 apart), the ledger in the middle, you in the last corner
const ROOMS=[
 {id:'data',name:'MARKET DATA',c:'#E46FD8',i:-1,j:-1,desc:'Market data: the tape, Databento 1-minute futures (the official record), news and the economic calendar.'},
 {id:'book',name:'THE BOOK',c:'#F2C14E',i:0,j:-1,desc:'The book: the four strategies, QuantLab, Noise band, ATR band and Expiry, running the exact backtest code.'},
 {id:'risk',name:'RISK',c:'#F59A3E',i:1,j:-1,desc:'Risk: the kill switch, sizing (1% per trade, whole micros, rounded down) and the cost rule.'},
 {id:'call',name:'MORNING CALL',c:'#E8876A',i:-1,j:0,desc:'Morning call: Claude, Gemini, Llama and GPT each read the morning inputs; the one-line rule votes too. Shadow only until scored.'},
 {id:'ledger',name:'LEDGER',c:'#ECE6D8',i:0,j:0,oct:1,desc:'Ledger: every booked day, hash-chained, with the code version. Rebuilt and checked every night.'},
 {id:'positions',name:'POSITIONS',c:'#3FC1B0',i:1,j:0,desc:'Positions: open trades and the paper account.'},
 {id:'lab',name:'LAB',c:'#7FA6FF',i:-1,j:1,desc:'Lab: the test suite and the latest research.'},
 {id:'score',name:'SCOREBOARD',c:'#4FD18B',i:0,j:1,desc:'Scoreboard: the shadow arms (1x, the one-line rule, the AI) scored from 1 Jan 2027.'},
 {id:'you',name:'YOU',c:'#E6B54A',i:1,j:1,sz:2.6,desc:'You: the only one who can change the rules, and only before the freeze.'}];
const R={};for(const r of ROOMS){const s=r.sz||4.4;r.u0=r.i*6.2-s/2;r.v0=r.j*6.2-s/2;r.s=s;R[r.id]=r}
const AG=[
 {id:'TAPE',room:'data',x:1.0,y:1.1,kind:'rack',st:'Prices'},{id:'DATABENTO',room:'data',x:3.3,y:1.1,kind:'rack',st:'1-minute futures'},
 {id:'NEWS',room:'data',x:1.0,y:3.3,kind:'rack',st:'Headlines'},{id:'CALENDAR',room:'data',x:3.3,y:3.3,kind:'rack',st:'Economic calendar'},
 {id:'QUANTLAB',room:'book',bot:'Quant',x:1.2,y:1.3,st:'Waiting for 9:30'},{id:'NOISE',room:'book',bot:'Noise',x:3.2,y:1.3,st:'Waiting'},
 {id:'ATR',room:'book',bot:'Atr',x:1.2,y:3.3,st:'Waiting'},{id:'EXPIRY',room:'book',bot:'Expiry',x:3.2,y:3.3,st:'Third Fridays only'},
 {id:'KILL',room:'risk',x:1.0,y:1.1,kind:'rack',red:1,st:'Off'},{id:'SIZE',room:'risk',bot:'Size',x:3.2,y:1.4,st:'1% per trade'},{id:'COST',room:'risk',bot:'Risk',x:2.0,y:3.3,st:'Cost rule: max 10% of 1R'},
 {id:'CLAUDE',room:'call',bot:'Claude',x:1.2,y:1.3,st:'Asked at 8:45'},{id:'GEMINI',room:'call',bot:'Gemini',x:3.2,y:1.3,st:'Asked at 8:45'},
 {id:'LLAMA',room:'call',bot:'Llama',x:1.2,y:3.3,st:'Asked at 8:45'},{id:'GPT',room:'call',bot:'Gpt',x:3.2,y:3.3,st:'Asked at 8:45'},{id:'RULE',room:'call',x:2.2,y:2.3,kind:'core',st:'One-line rule'},
 {id:'CHAIN',room:'ledger',x:2.2,y:2.2,kind:'core',st:'Hash chain'},{id:'FILLS',room:'ledger',bot:'Fills',x:1.2,y:1.2,st:'Books after the close'},{id:'CODE',room:'ledger',x:3.4,y:3.3,kind:'rack',st:'Code version'},
 {id:'BOOK',room:'positions',x:1.4,y:1.4,kind:'rack',st:'0 open'},{id:'ACCOUNT',room:'positions',x:3.1,y:3.0,kind:'rack',st:'$100,000'},
 {id:'TESTS',room:'lab',x:1.3,y:1.4,kind:'rack',st:'Test suite'},{id:'RESEARCH',room:'lab',bot:'Filter',x:3.1,y:3.0,st:'Latest research'},
 {id:'ARMS',room:'score',x:2.2,y:2.2,kind:'rack',st:'Starts 1 Jan'},
 {id:'YOU',room:'you',x:1.3,y:1.3,kind:'you',st:'Watching'}];
const A={};for(const a of AG){a.u=R[a.room].u0+a.x;a.v=R[a.room].v0+a.y;a.work=0;a.blink=Math.random()*4;A[a.id]=a}
const LINKS=[['data','book'],['data','call'],['book','risk'],['book','ledger'],['call','ledger'],['risk','positions'],['ledger','positions'],['ledger','score'],['call','lab'],['lab','score'],['score','you'],['positions','you']];
const ctr=r=>({u:r.u0+r.s/2,v:r.v0+r.s/2});
function corridor(a,b){const p=ctr(R[a]),q=ctr(R[b]);if(Math.abs(p.u-q.u)<.01||Math.abs(p.v-q.v)<.01)return [p,q];return [p,{u:q.u,v:p.v},q]}
const COR=LINKS.map(([a,b])=>({a,b,pts:corridor(a,b)}));
const GRAPH={};for(const {a,b} of COR){(GRAPH[a]=GRAPH[a]||[]).push(b);(GRAPH[b]=GRAPH[b]||[]).push(a)}
function route(a,b){const prev={[a]:null},q=[a];while(q.length){const x=q.shift();if(x===b)break;for(const y of GRAPH[x]||[])if(!(y in prev)){prev[y]=x;q.push(y)}}
 const path=[];for(let x=b;x;x=prev[x])path.unshift(x);return path}
// ================= projection + camera =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
const T=22;  // half tile width in px at zoom 1
const cam={x:0,y:0,s:1},goal={x:0,y:0,s:1};
const iso=(u,v,z=0)=>({x:(u-v)*T,y:(u+v)*T/2-z*T});
let VX=0,VY=0,VW=0,VH=0;
function area(){const sh=document.getElementById('sheet'),wide=W>900;const top=wide?90:130;
 if(wide){const left=sh.getBoundingClientRect().right+12;VX=(left+W-70)/2;VW=W-left-90;VY=(top+H)/2;VH=H-top-20}else{const b=sh.getBoundingClientRect().top-10;VX=W/2;VW=W-24;VY=(top+b)/2;VH=Math.max(160,b-top)}}
const scr=(u,v,z=0)=>{const p=iso(u,v,z);return{x:(p.x-cam.x)*cam.s+VX,y:(p.y-cam.y)*cam.s+VY}};
function bounds(list){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const r of list)for(const [u,v] of [[r.u0,r.v0],[r.u0+r.s,r.v0],[r.u0,r.v0+r.s],[r.u0+r.s,r.v0+r.s]]){const p=iso(u,v);x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}return{x0,x1,y0,y1}}
function fitTo(list,pad=1){area();const b=bounds(list);goal.s=Math.max(.35,Math.min(3.2,Math.min(VW/(b.x1-b.x0),VH/(b.y1-b.y0+40))*pad));goal.x=(b.x0+b.x1)/2;goal.y=(b.y0+b.y1)/2-12/goal.s}
// ================= drawing =================
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function roomPts(r,z){if(!r.oct)return [[r.u0,r.v0],[r.u0+r.s,r.v0],[r.u0+r.s,r.v0+r.s],[r.u0,r.v0+r.s]].map(([u,v])=>scr(u,v,z));
 const c=ctr(r),k=r.s/2,e=k*.42;return [[-e,-k],[e,-k],[k,-e],[k,e],[e,k],[-e,k],[-k,e],[-k,-e]].map(([a,b])=>scr(c.u+a,c.v+b,z))}
let sel=null,hover=null;
function drawRoom(r,t){const th=.18,on=sel===r.id,hv=hover===r.id;
 poly(roomPts(r,0));ctx.fillStyle='#000';ctx.fill();
 const top=roomPts(r,th);poly(top);ctx.fillStyle=on?'#0f0f0f':'#090909';ctx.fill();
 // faint floor grid
 ctx.save();poly(top);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
 for(let k=1;k<r.s;k+=.8){let a=scr(r.u0+k,r.v0,th),b=scr(r.u0+k,r.v0+r.s,th);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();a=scr(r.u0,r.v0+k,th);b=scr(r.u0+r.s,r.v0+k,th);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 ctx.restore();

 if(id==='data')x=[`Desk last checked ${FEED?FEED.checked:'?'}`,...Object.entries(st.data_last_bar_utc||{}).map(([k,v])=>`${k} last Databento bar ${v} UTC`),...((dc&&dc.inputs&&dc.inputs.calendar)||[]).map(c=>'Calendar: '+c)];
 if(id==='book')x=LV?[`Live view (unofficial) as of ${LV.as_of}: ${(LV.trades||[]).length} trades`,...(LV.warnings||[])]:['No live view yet'];
 if(id==='call')x=dc?[`${dc.date} at ${dc.made_at}${dc.late?' (late)':''}: AI ${sz(dc.ai_size_used)}, rule ${sz(dc.dumb_size)}`,dc.council&&dc.council.counted?`Council average: trend ${dc.council.trend_probability}%, size ${sz(dc.council.size)}`:'Council: not enough answers to count','Shadow only: the book always trades 1x']:['First morning call: 8:45 New York on a trading day'];
 if(id==='risk')x=[`Kill switch: ${ck.kill||'?'}`,'1% per trade, whole micros rounded down, cap 200','Cost rule: skip any trade whose costs are over 10% of 1R'];
 if(id==='ledger')x=[`${st.book||'?'} book: ${st.state||'not run yet'}`,`Chain: ${ck.chain||'?'} · replay: ${ck.replay||'?'}`,`Head ${LG&&LG.head_hash?LG.head_hash.slice(0,12):'(empty)'} · code ${st.code||'?'}`,`Last run ${st.run_at||'?'}`];
 if(id==='positions')x=[`Account ${money(st.equity||100000)} (double costs ${money(st.equity_2x||100000)})`,`Position check: ${ck.positions||'?'}`];
 if(id==='score')x=FEED&&FEED.daytype_score?[`${FEED.daytype_score.scored_days} days scored: ${FEED.daytype_score.verdict}`]:['The shadow arms are scored from 1 Jan 2027'];
 if(id==='lab')x=[TESTS?`Tests: ${TESTS.conclusion||TESTS.status} (${TESTS.sha}, ${TESTS.when})`:'Tests: unknown',...(LAB?['Latest research: '+LAB]:[])];
 const hc=HEALTH[id]||GR;return `<b>${h}</b> <span style="color:${hc}">● ${HWORD[hc]}</span><br>${esc(rest.join(': '))}${x.length?'<br><span style="color:var(--quiet)">'+x.map(esc).join('<br>')+'</span>':''}`}
const sz=x=>x==null?'?':x===0?'veto':x+'x';let LAB='';
// ---------- statuses + beams from the data
function refresh(){health();const st=(LG&&LG.status)||{},ck=st.checks||{},n=ny();
 A.KILL.st=ck.kill?(String(ck.kill).startsWith('off')?'Off':'ON'):'?';A.KILL.red=ck.kill&&!String(ck.kill).startsWith('off')?1:0;
 A.ACCOUNT.st=money(st.equity||100000);A.CHAIN.st=LG&&LG.head_hash?'Head '+LG.head_hash.slice(0,8):'Empty until '+(st.start||'16 Nov');A.CODE.st=st.code?'Code '+String(st.code).slice(0,7):'Code version';
 A.FILLS.st=st.last_booked?'Last booked '+st.last_booked:'Books after the close';
 const lt=(LV&&LV.date===n.date&&LV.trades)||[],open=lt.filter(t=>t.state==='open');A.BOOK.st=open.length?`${open.length} open (unofficial)`:'Flat';
 for(const k in BOTOF){const mine=lt.filter(t=>t.strategy===k);A[BOTOF[k]].st=mine.length?mine.map(t=>`${t.side} ${t.state} ${t.R_now>=0?'+':''}${t.R_now.toFixed(2)}R`).join(', '):(k==='expiry'?'Third Fridays only':'No trade today')}
 const dc=FEED&&FEED.daytype,M=(dc&&dc.council&&dc.council.members)||{};BEAMS=[];
 const who={claude:'CLAUDE',gemini:'GEMINI',llama:'LLAMA',gpt:'GPT'};
 for(const [k,id] of Object.entries(who)){const v=k==='claude'?(dc&&dc.ai):M[k];A[id].st=v&&v.trend_probability!=null?`Trend ${v.trend_probability}% · ${sz(v.veto?0:v.size)}`:'No answer'}
 const ks=Object.keys(who).filter(k=>{const v=k==='claude'?(dc&&dc.ai):M[k];return v&&v.trend_probability!=null});
 for(let a=0;a<ks.length;a++)for(let b=a+1;b<ks.length;b++){const va=ks[a]==='claude'?dc.ai:M[ks[a]],vb=ks[b]==='claude'?dc.ai:M[ks[b]],gap=Math.abs(va.trend_probability-vb.trend_probability);
  if(gap>=25||va.size!==vb.size)BEAMS.push([who[ks[a]],who[ks[b]],Math.min(1.5,gap/40+.4)])}
 A.RULE.st=dc?'Rule says '+sz(dc.dumb_size):'One-line rule';A.ARMS.st=n.date<'2027-01-01'?'Starts 1 Jan':'Scoring';
 A.TESTS.st=TESTS?(TESTS.conclusion==='success'?'Passing':TESTS.conclusion||TESTS.status):'Test suite';
 const v=document.getElementById('val'),d=document.getElementById('dv');
 if(!HIST){v.textContent=money(st.equity||100000);const day=LG&&LG.days&&LG.days[0];d.textContent=day?`${day.usd>=0?'+':'−'}$${Math.abs(day.usd).toLocaleString('en-US')} ${day.date.slice(5)}`:'';d.classList.toggle('neg',day&&day.usd<0);
  document.getElementById('pillnote').textContent=st.book==='official'?'paper account · official ledger':`${st.book||'practice'} book · official from 1 Jan 2027`}
 if(sel)cap.innerHTML=roomInfo(sel)}
// ---------- the trades tab and "why it fired"
function tradesOf(date){const n=ny();if(LV&&date===LV.date&&date===n.date)return {src:'live',list:LV.trades||[],skipped:LV.skipped||[]};
 const d=LG&&(LG.days||[]).find(x=>x.date===date);return d?{src:'ledger',list:d.trades,skipped:d.skipped}:{src:'none',list:[],skipped:[]}}
function renderTab(){const sht=document.getElementById('sht').firstChild,d=document.createElement('div');
 if(TAB==='log'){sht.textContent='COMMS LOG';body.replaceChildren(logEl);return}
 if(TAB==='trades'){sht.textContent='TRADES';const n=ny(),days=[];if(LV&&LV.date===n.date)days.push(n.date);for(const x of (LG&&LG.days)||[])if(!days.includes(x.date))days.push(x.date);
  d.innerHTML=days.length?days.slice(0,12).map(dd=>{const T=tradesOf(dd);return `<div class="dh">${dd}${T.src==='live'?' <span class="uo">unofficial live view</span>':''}</div>`+
   (T.list.length?T.list.map((t,i)=>`<button class="tr2" data-d="${dd}" data-i="${i}"><span>${NAMEOF[t.strategy]} · ${t.side} ${t.contracts} ${t.contract}</span><span style="color:${(t.R_now??t.R)>=0?'var(--up)':'var(--down)'}">${t.state==='open'?'open ':''}${(t.R_now??t.R)>=0?'+':''}${(+(t.R_now??t.R)).toFixed(2)}R</span><span class="q">${t.entry_time}${t.exit_time?'–'+t.exit_time:''} · ${t.usd!=null?((t.usd>=0?'+':'−')+'$'+Math.abs(t.usd).toLocaleString('en-US')):'unrealised'}</span></button>`).join(''):'<p class="note">No trades.</p>')+
   T.skipped.map(k=>`<p class="note">Skipped: ${esc(k.id.split('|')[0])} · ${esc(k.reason)}</p>`).join('')}).join(''):'<p class="note">No trades yet. The practice book starts 16 Nov 2026; the official one on 1 Jan 2027.</p>';
  d.querySelectorAll('.tr2').forEach(b=>b.onclick=()=>why(b.dataset.d,+b.dataset.i));body.replaceChildren(d);return}
 if(TAB==='summary'){sht.textContent='DAILY SUMMARY';const ks=Object.keys(SUM||{}).sort().reverse();
  d.innerHTML=ks.length?ks.slice(0,10).map(k=>`<div class="dh">${k}</div><p class="sum">${esc(SUM[k].text)}</p><p class="note">Written by ${esc(SUM[k].by)} from the ledger's facts.</p>`).join(''):'<p class="note">The first plain-English summary arrives the night after the first booked practice day (16 Nov).</p>';body.replaceChildren(d);return}
 if(TAB==='replay'){sht.textContent='REPLAY';renderReplay(d);body.replaceChildren(d)}}
async function why(date,i){const T=tradesOf(date),t=T.list[i];if(!t)return;const d=document.createElement('div');
 let bars=null;if(T.src==='live')bars=LV.bars&&LV.bars[t.market];else bars=LG.bars&&LG.bars[date]&&LG.bars[date][t.market];
 if(!bars&&t.market==='NQ'){CHART=CHART||await get('data/chart.json');bars=CHART&&CHART.sessions&&CHART.sessions[date]&&CHART.sessions[date].bars}
 const R1=t.R_now??t.R;
 d.innerHTML=`<button class="back">← trades</button><div class="dh">${date} · ${NAMEOF[t.strategy]} · ${t.side} ${t.contracts} ${t.contract}${T.src==='live'?' <span class="uo">unofficial</span>':''}</div>
  <p class="sum">${esc(RULES[t.strategy])}${t.variant!=null?` This month it runs variant ${t.variant} (picked from the last six months).`:''}</p>${spark(bars,t)}
  <div class="kv"><div><span>ENTRY</span><b>${t.entry} · ${t.entry_time}</b></div><div><span>STOP</span><b>${t.stop}</b></div>
  <div><span>EXIT</span><b>${t.exit!=null?t.exit+' · '+t.exit_time:'open, last '+t.last}</b></div><div><span>RESULT</span><b style="color:${R1>=0?'var(--up)':'var(--down)'}">${R1>=0?'+':''}${(+R1).toFixed(2)}R</b></div>
  <div><span>RISK</span><b>${t.risk_usd!=null?money(t.risk_usd):'–'}</b></div><div><span>COST</span><b>${t.usd_cost!=null?money(t.usd_cost):'in R'}</b></div></div>
  <p class="note">${T.src==='live'?'From the unofficial live view (Yahoo, delayed). The nightly ledger is the record.':'From the hash-chained ledger: id '+esc(t.id)+'.'}</p>`;
 d.querySelector('.back').onclick=renderTab;body.replaceChildren(d);const bot=BOTOF[t.strategy];if(bot){A[bot].work=2.2;select('book')}}
function spark(bars,t){if(!bars||!bars.length)return '<p class="note">No chart for this day.</p>';const W=360,H=120,lo=Math.min(...bars.map(b=>b[3]),t.stop,t.entry),hi=Math.max(...bars.map(b=>b[2]),t.stop,t.entry),m0=570,m1=960;
 const X=m=>(m-m0)/(m1-m0)*W,Y=v=>H-6-(v-lo)/((hi-lo)||1)*(H-12);let p='';for(const b of bars){const x=X(b[0]+2.5);p+=`<line x1="${x}" x2="${x}" y1="${Y(b[2])}" y2="${Y(b[3])}" stroke="${b[4]>=b[1]?'#3FCF8E':'#F25F5C'}" stroke-opacity=".7"/>`}
 const e=X(mm(t.entry_time)),x=t.exit_time?X(mm(t.exit_time)):W,c=t.side==='long'?'#3FCF8E':'#F25F5C';
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${p}<line x1="${e}" x2="${x}" y1="${Y(t.entry)}" y2="${Y(t.entry)}" stroke="#EDEDED" stroke-width="1.2"/>
  <line x1="${e}" x2="${x}" y1="${Y(t.stop)}" y2="${Y(t.stop)}" stroke="#F25F5C" stroke-dasharray="3 3"/>${t.exit!=null?`<circle cx="${x}" cy="${Y(t.exit)}" r="3.5" fill="#E6B54A"/>`:''}<circle cx="${e}" cy="${Y(t.entry)}" r="3.5" fill="${c}"/></svg>
  <p class="note">Nasdaq${t.market==='ES'?'/S&P':''} 5-minute bars, 9:30–16:00. White: entry · red dashed: stop · gold: exit.</p>`}
// ---------- replay slider + history mode
let RP={date:null,t:570,play:null};
function replayEvents(date){const T=tradesOf(date),ev=[];const call=(FEED&&(FEED.daytype_history||[]).find(x=>x.date===date))||null;
 if(call)ev.push({m:mm(call.made_at),f:'CLAUDE',to:'RULE',msg:`Morning call: AI ${sz(call.ai_size_used)}, rule ${sz(call.dumb_size)} (shadow only).`});
 for(const t of T.list){const b=BOTOF[t.strategy];ev.push({m:mm(t.entry_time),f:b,to:'COST',msg:`${NAMEOF[t.strategy]}: ${t.side} ${t.market} at ${t.entry}, stop ${t.stop}.`},{m:mm(t.entry_time),f:'SIZE',to:'BOOK',msg:`${t.contracts} ${t.contract} at 1% risk.`});
  if(t.exit_time)ev.push({m:mm(t.exit_time),f:'BOOK',to:'FILLS',msg:`${NAMEOF[t.strategy]} out at ${t.exit}: ${(t.R>=0?'+':'')+(+t.R).toFixed(2)}R.`})}
 if(T.src==='ledger')ev.push({m:961,f:'FILLS',to:'CHAIN',msg:'Day booked into the ledger.'});return ev.sort((a,b)=>a.m-b.m)}
function applyReplay(fire,from){const T=tradesOf(RP.date),t=RP.t;let usd=0,open=0;
 for(const x of T.list){const e=mm(x.entry_time),q=x.exit_time?mm(x.exit_time):9999,b=BOTOF[x.strategy];if(t>=e&&t<q){open++;A[b].st=`${x.side} open`}else if(t>=q){usd+=x.usd||0;A[b].st=`${(x.R>=0?'+':'')+(+x.R).toFixed(2)}R`}else A[b].st='Waiting'}
 A.BOOK.st=`${open} open at ${hm2(Math.min(t,960))}`;document.getElementById('val').textContent=`${usd>=0?'+':'−'}$${Math.abs(usd).toLocaleString('en-US',{maximumFractionDigits:0})}`;
 document.getElementById('dv').textContent=hm2(Math.min(t,960))+' NY';document.getElementById('pillnote').textContent=`history · ${RP.date}`;
 if(fire)for(const e of replayEvents(RP.date))if(e.m>from&&e.m<=t)send(e.f,e.to,e.msg,hm2(Math.min(e.m,960)));
 const tl=document.getElementById('rpt');if(tl)tl.textContent=hm2(Math.min(t,960))}
function renderReplay(d){const n=ny(),days=[];if(LV&&LV.date===n.date)days.push(n.date);for(const x of (LG&&LG.days)||[])days.push(x.date);
 if(!days.length){d.innerHTML='<p class="note">Nothing to replay yet: the practice book starts 16 Nov 2026.</p>';return}
 RP.date=RP.date&&days.includes(RP.date)?RP.date:days[0];
 d.innerHTML=`<div class="rp"><select id="rpd">${days.map(x=>`<option${x===RP.date?' selected':''}>${x}</option>`).join('')}</select><button id="rpp">▶ Play</button><button id="rpl">Live</button></div>
  <input type="range" id="rps" min="540" max="961" step="1" value="${RP.t}"><div class="rpl"><span>9:00</span><b id="rpt">${hm2(RP.t)}</b><span>16:00</span></div>
  <p class="note">History mode: the desk shows that day as it happened. Drag the slider or press play; Live goes back to now.</p>`;
 const sl=d.querySelector('#rps');HIST=RP.date;document.getElementById('badge').innerHTML='<i></i>History · '+RP.date;
 d.querySelector('#rpd').onchange=e=>{RP.date=e.target.value;RP.t=540;sl.value=540;HIST=RP.date;document.getElementById('badge').innerHTML='<i></i>History · '+RP.date;applyReplay(false)};
 sl.oninput=()=>{const old=RP.t;RP.t=+sl.value;applyReplay(Math.abs(RP.t-old)<20,old)};
 d.querySelector('#rpp').onclick=e=>{if(RP.play){clearInterval(RP.play);RP.play=null;e.target.textContent='▶ Play';return}e.target.textContent='❚❚ Pause';if(RP.t>=961)RP.t=540;
  RP.play=setInterval(()=>{const old=RP.t;RP.t=Math.min(961,RP.t+2);sl.value=RP.t;applyReplay(true,old);if(RP.t>=961){clearInterval(RP.play);RP.play=null;e.target.textContent='▶ Play'}},120)};
 d.querySelector('#rpl').onclick=()=>{if(RP.play)clearInterval(RP.play);RP.play=null;HIST=null;document.getElementById('badge').innerHTML='<i></i>Live · real data';refresh();
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='log'));TAB='log';renderTab()};applyReplay(false)}
// ---------- live comms from real events
function playMorning(dc){const M=(dc.council&&dc.council.members)||{},q=[],v=(k,x)=>x&&x.trend_probability!=null?`trend ${x.trend_probability}%, size ${sz(x.veto?0:x.size)}. ${x.reason||''}`:'no answer.';
 q.push(['CALENDAR','CLAUDE',`Inputs: VIX ${dc.inputs.vix} (${dc.inputs.vix_1y_percentile}th pct), range ratio ${dc.inputs.range_ratio}, RSI5 ${dc.inputs.rsi5}.`]);
 q.push(['CLAUDE','RULE','Claude: '+v('claude',dc.ai)]);for(const [k,id] of [['gemini','GEMINI'],['llama','LLAMA'],['gpt','GPT']])q.push([id,'RULE',k[0].toUpperCase()+k.slice(1)+': '+v(k,M[k])]);
 q.push(['RULE','SIZE',`Rule ${sz(dc.dumb_size)} · AI ${sz(dc.ai_size_used)}${dc.council&&dc.council.counted?` · council average trend ${dc.council.trend_probability}%`:''}. Shadow only: the book trades 1x.`]);
 q.forEach((m,i)=>setTimeout(()=>send(m[0],m[1],m[2],dc.made_at),i*1600));return q.length*1600}
const seen=new Set();
function playNew(){const n=ny(),q=[];
 if(FEED&&FEED.daytype&&!seen.has('call'+FEED.daytype.date)){seen.add('call'+FEED.daytype.date);q.push(()=>playMorning(FEED.daytype))}
 if(LV&&LV.date===n.date)for(const t of LV.trades||[]){const k=t.id+t.state;if(seen.has(k))continue;seen.add(k);const b=BOTOF[t.strategy];
  q.push(()=>{send(b,'COST',`${NAMEOF[t.strategy]}: ${t.side} ${t.market} at ${t.entry}, stop ${t.stop} (unofficial live view).`,t.entry_time);
   setTimeout(()=>send('SIZE','BOOK',`${t.contracts} ${t.contract} at 1% risk.`,t.entry_time),1600);if(t.state==='closed')setTimeout(()=>send('BOOK','ACCOUNT',`${NAMEOF[t.strategy]} closed at ${t.exit}: ${t.R_now>=0?'+':''}${t.R_now.toFixed(2)}R.`,t.exit_time),3200);return 4800})}
 const st=LG&&LG.status;if(st&&st.run_at&&!seen.has('run'+st.run_at)){seen.add('run'+st.run_at);
  q.push(()=>{send('DATABENTO','FILLS',`Nightly run ${st.run_at.slice(0,16).replace('T',' ')} NY: ${(st.booked_now||[]).length} day(s) booked.`,'');setTimeout(()=>send('FILLS','CHAIN',`Chain ${st.checks.chain||'?'} · replay ${st.checks.replay||'?'}`,''),1600);
   setTimeout(()=>send('CHAIN','ACCOUNT',`${st.checks.positions||''} Account ${money(st.equity||100000)}.`,''),3200);return 4800})}
 if(TESTS&&!seen.has('t'+TESTS.sha)){seen.add('t'+TESTS.sha);q.push(()=>{send('TESTS','YOU',`Tests ${TESTS.conclusion||TESTS.status} on ${TESTS.sha}.`,'');return 1600})}
 let delay=0;for(const f of q){setTimeout(()=>{const ms=f()},delay);delay+=5200}}
async function poll(){const [f,lg,lv,sm]=await Promise.all([get('desk_feed.json'),get('data/ledger.json'),get('data/live_view.json'),get('data/daily_summary.json')]);
 if(f)FEED=f;if(lg)LG=lg;if(lv)LV=lv;if(sm)SUM=sm;
 try{const r=await get('https://api.github.com/repos/drusiyani/argon-v2/actions/workflows/tests.yml/runs?per_page=1');const x=r&&r.workflow_runs&&r.workflow_runs[0];if(x)TESTS={status:x.status,conclusion:x.conclusion,sha:x.head_sha.slice(0,7),when:x.updated_at.slice(0,16).replace('T',' ')}}catch(e){}
 if(!LAB){const rs=await get('data/research.json');try{const ds=(rs&&(rs.docs||rs.pages||rs.items||[]))||[];const last=ds[ds.length-1];LAB=last?(last.title||last.name||''):''}catch(e){}}
 document.getElementById('badge').innerHTML=HIST?'<i></i>History · '+HIST:(FEED||LG?'<i></i>Live · real data':'<i></i>Can\'t reach the data');
 refresh();if(!HIST)playNew();if(TAB==='trades'||TAB==='summary')renderTab()}
if(window.top!==window)document.documentElement.classList.add('embedded');
poll();setInterval(poll,60000);
