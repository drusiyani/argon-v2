 $('#cnt').textContent=CAL.mode==='bt'?`Backtest of the main book (G3, 0.625% per rules trade). Squares are trading days; colour strength shows the size of the day's gain or loss, capped at ±${cap}%. Tap one for its trades and G3's take-or-skip calls.`:'The practice ledger since 16 November (official from 1 February). Tap a day for its trades and the morning call.';
 $('#cms').onclick=e=>{const b=e.target.closest('button.dc');if(b)dayView(b.dataset.d,D[b.dataset.d])}}
async function dayView(d,x){const live=CAL.mode==='live',dt=new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
 const tk=x.t.filter(t=>t[5]),sk=x.t.filter(t=>!t[5]),sumR=a=>a.reduce((s,t)=>s+t[4],0);
 const row=t=>`<div class="dtr ${t[5]?'':'sk'}"><span class="ar" style="background:color-mix(in srgb,${t[1]>0?'var(--green)':'var(--red)'} 15%,transparent);color:${t[1]>0?'var(--green)':'var(--red)'}">${t[1]>0?'↑':'↓'}</span>
  <div><b>${esc(SN[t[0]]||t[0])}</b> <span class="t">${t[6]&&t[6]!=='NQ'?esc(t[6])+' · ':''}${t[1]>0?'long':'short'} · ${hm(t[2])} → ${hm(t[3])}${t[5]?'':' · skipped by G3'}</span></div>
  <span class="num ${t[4]>=0?'up':'dn'}" style="font-weight:650">${t[4]>=0?'+':M}${Math.abs(t[4]).toFixed(2)}R</span></div>`;
 let h=`<p class="src" style="margin:4px 0 0">${live?'Live ledger':'Backtest · main book'}</p><h2 style="margin:4px 0 2px">${dt}</h2>
  <div class="big ${x.r>=0?'up':'dn'}">${pct(x.r,2)}</div><p class="q" style="margin:0 0 14px">${live?money(x.usd)+' · account '+money(x.eq)+(x.regime?' · '+esc(x.regime)+' day':''):'Nasdaq that day '+pct(x.nq,2)}</p>
  <h3>Trades taken <span class="chip">${tk.length}</span></h3>${tk.length?tk.map(row).join(''):'<p class="sub">No trades.</p>'}`;
 if(!live){h+=`<h3 style="margin-top:20px">Decisions <span class="chip">${sk.length} skipped</span></h3><p class="sub">G3 scored every momentum trade before it was placed and skipped the ones it expected to lose after costs.${sk.length?` The skipped trades would have made <b class="${sumR(sk)>=0?'up':'dn'}">${sumR(sk)>=0?'+':M}${Math.abs(sumR(sk)).toFixed(2)}R</b>.`:''}</p>${sk.map(row).join('')}`}
 else{const c=x.call;if(c){const S=c.seats||{},names={claude:'Claude',gpt:'GPT',gemini:'Gemini',deepseek:'DeepSeek',kimi:'Kimi'};
   h+=`<h3 style="margin-top:20px">Morning call <span class="chip">${esc(c.at||'')} New York</span></h3><div class="list">${Object.keys(S).map(k=>`<div class="li"><span class="k">${names[k]||esc(k)}</span><span class="v">${S[k]?Math.round(S[k].p)+'% trend · '+S[k].s+'×':'<span class="qq">no answer</span>'}</span></div>`).join('')}
    <div class="li"><span class="k">Size used (shadow)</span><span class="v">${esc(c.used)}×</span></div><div class="li"><span class="k">One-line rule · random · forecaster</span><span class="v">${esc(c.rule)}× · ${esc(c.rnd)}× · ${esc(c.mkt??'–')}×</span></div></div>
    ${c.errors&&c.errors.length?`<p class="sub" style="margin-top:10px">Errors recorded: ${c.errors.map(esc).join(', ')}.</p>`:''}${c.heads&&c.heads.length?`<h3 style="margin-top:18px">Headlines the AIs saw</h3><ul class="sub">${c.heads.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}`}}
 const nk=live?x.note:'Days/'+d;h+=`<p style="margin-top:20px"><a class="btn ghost" href="#brain" id="dnote">Open the brain note ${ic('arrow')}</a></p>`;sheet(h);
 $('#dnote').onclick=async e=>{e.preventDefault();await notes();const i=NIDX[nk.toLowerCase()];if(i!=null)sheet(noteHTML(i));else $('#dnote').outerHTML='<p class="sub">No brain note for this day (the older backtest days are only in the ledger of results).</p>'}}
// ---- notes list + reader
async function notesView(){const box=$('#b-notes');if(box.dataset.ok)return;box.dataset.ok=1;box.innerHTML='<p class="sub">Loading the notes…</p>';
 try{await notes()}catch(e){box.innerHTML='<p class="sub">The notes could not load.</p>';return}
 box.innerHTML=`<div class="notes"><div class="card" style="padding:0"><div style="padding:12px 12px 0"><input class="search" id="nq" placeholder="Search ${NOTES.length} notes" style="width:100%"></div><div class="dlist" id="nl"></div></div><article class="card reader" id="nr"></article></div>`;
 const list=q=>{const g={};NOTES.forEach((n,i)=>{if(!q||n.title.toLowerCase().includes(q)||n.text.toLowerCase().includes(q))(g[n.folder]=g[n.folder]||[]).push(i)});
  $('#nl').innerHTML=Object.keys(g).sort().map(k=>`<div class="fd">${esc(k)} · ${g[k].length}</div>`+g[k].slice(-60).reverse().map(i=>`<a data-i="${i}">${esc(NOTES[i].title)}</a>`).join('')).join('')||'<p class="sub" style="padding:10px">No notes match.</p>'};
 const open=i=>{$$('#nl a').forEach(a=>a.classList.toggle('on',+a.dataset.i===i));if(innerWidth<900)sheet(noteHTML(i));else{$('#nr').innerHTML=noteHTML(i);$('#nr').animate([{opacity:0},{opacity:1}],{duration:250})}};
 $('#nl').onclick=e=>{const a=e.target.closest('a[data-i]');if(a)open(+a.dataset.i)};$('#nq').oninput=e=>list(e.target.value.trim().toLowerCase());list('');if(innerWidth>=900)open(NIDX['home']??0)}

// ================= DESK: each AI is a living orb (AI-Orb by Nick Vyhouski, MIT, vendor/ai-orb), the council's orb in the middle
const SEAT={claude:['Claude','Anthropic','#D97757','ember'],gpt:['GPT','OpenAI','#10A37F','moss'],gemini:['Gemini','Google','#4285F4','iris'],deepseek:['DeepSeek','seat 4, moving to Kimi','#4D6BFE','discharge'],kimi:['Kimi','Moonshot','#9aa3b2','porcelain']};
const ORBS=[];
async function mountOrbs(root){try{await need('orb')}catch(e){return}if(!window.AIOrb)return;
 const gold={stops:['#f08a24','#ffc25e','#fff0c8'],body:'#0a0705'};
 $$('canvas[data-orb]',root).forEach((c,k)=>{const pal=c.dataset.orb,colors=pal==='gold'?gold:AIOrb.orbPalettes[pal].dark;
  try{const r=new AIOrb.OrbRenderer(c,{finish:c.dataset.finish||'ink',field:'dark',colors,state:c.dataset.state||'idle',grain:.12,seed:k*17+3,speed:1,still:reduce});if(r.supported){r.start();ORBS.push(r)}}catch(e){}})}
function desk(){const v=$('#v-desk'),D=DATA.desk||{},dc=D.daytype,L=DATA.ledger||{},sc=D.score||{};
 const mem=(dc&&dc.council&&dc.council.members)||{},keys=Object.keys(mem).length?Object.keys(mem):['claude','gpt','gemini','kimi'],answered=keys.filter(k=>mem[k]).length,council=dc&&dc.council&&dc.council.counted?dc.council:null;
 const p=council?council.trend_probability:(dc&&dc.ai&&dc.ai.trend_probability),st=council?'speaking':answered?'thinking':'idle';
 const pos=[[17,24],[83,24],[17,78],[83,78]];
 v.innerHTML=`<h1 class="title">Desk</h1><p class="lede">Every weekday at 8:45 New York, four AIs each say whether the day will trend and how big the book should be. Until Race 1 it is a shadow test: it never changes a real trade.</p>
 <div class="council rv"><div class="cstage"><svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${keys.slice(0,4).map((k,j)=>`<line x1="50" y1="50" x2="${pos[j][0]}" y2="${pos[j][1]}" class="${mem[k]?'on':''}" style="--c:${(SEAT[k]||[,,'#888'])[2]}"/>`).join('')}</svg>
   <div class="core"><canvas data-orb="gold" data-finish="ink" data-state="${st}"></canvas></div>
   ${keys.slice(0,4).map((k,j)=>{const m=mem[k],[n,co,c,pal]=SEAT[k]||[k,'','#888','porcelain'];return`<div class="so ${m?'on':''}" style="left:${pos[j][0]}%;top:${pos[j][1]}%;--d:${j*.7}s"><canvas data-orb="${pal}" data-finish="${m?'ink':'pearl'}" data-state="${m?'speaking':'idle'}"></canvas><b>${n}</b><span>${m?Math.round(m.trend_probability)+'% · '+m.size+'×':'no answer'}</span></div>`}).join('')}
   <div class="cval"><b>${p==null?'–':Math.round(p)+'%'}</b><span>${council?'council · trend chance':'trend chance'}</span></div></div>
  <div class="dside"><p class="src" style="margin:0">${dc?esc(dc.date)+' · '+esc(dc.made_at)+' New York':'Waiting for the first call'}</p>
   <h2 style="margin:4px 0 6px">${council?'The council says '+council.size+'×':answered?answered+' of '+keys.length+' answered':'No forecast today'}</h2>
   <p class="sub">${dc&&!answered?'No AI answered this morning, so the call counts as 1×. Every miss is logged with its error.':council?'The middle of the seats that answered. Logged, not used, until Race 1 is scored.':'The size it would set is logged, not used, until Race 1 is scored.'}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${dc?[['Used today',dc.ai_size_used+'×','y'],['One-line rule',dc.dumb_size+'×',''],['Random sizer',dc.random_size+'×',''],['Shadow only','','g']].map(([k,x,c])=>`<span class="chip ${c}">${k}${x?' <b>'+esc(x)+'</b>':''}</span>`).join(''):''}</div></div></div>
 <h2 class="rv">The four seats</h2><p class="sub rv">Each AI answers alone, from the same frozen prompt. The best model from each company is pinned on the freeze date.</p>
 <div class="seats">${keys.map(k=>{const m=mem[k],[n,co,c]=SEAT[k]||[k,'',"#888"];
   return `<div class="card seat tilt rv" style="--c:${c}"><div class="who"><span class="av" style="background:${c}">${n[0]}</span><div><b>${n}</b><small>${co}</small></div><span class="dot ${m?'on':''}"></span></div>
   ${m?`<div style="display:flex;justify-content:space-between;font-size:14px"><span class="q">Trend chance</span><b class="num">${Math.round(m.trend_probability)}%</b></div><div class="pbar"><i style="width:${m.trend_probability}%;background:${c}"></i></div>
   <span class="chip y">size ${m.size}×</span><p class="why">${esc(m.reason||'')}</p>`:`<p class="qq" style="margin:0;font-size:14px">No answer this morning.</p>`}</div>`}).join('')}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card rv"><h3>Practice book</h3><p class="sub">Paper money, same code as the race.</p><div class="big num">${money(L.equity)}</div>
   ${spark([1e5,...(DATA.equity||[]).map(x=>x[1])],'var(--gold)')}<div class="list">${Object.entries(L.checks||{}).map(([k,x])=>`<div class="li"><span class="k">${{kill:'Kill switch',chain:'Ledger chain',replay:'Replay check',positions:'Open positions'}[k]||esc(k)}</span>
   <span class="v" style="display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px">${esc(String(x).split('(')[0])}${/ok|off|flat/.test(x)?`<span class="ok">${ic('check',3)}</span>`:''}</span></div>`).join('')}</div></div>
  <div class="card rv hist"><h3>Recent calls</h3><p class="sub">The size the AI arm used each morning, against the one-line rule.</p><div class="list">${(DATA.history||[]).slice().reverse().slice(0,8).map(h=>`<div class="li"><span class="k">${esc(h.date)}</span><span class="v">${h.p==null?'<span class="qq">no forecast</span>':Math.round(h.p)+'%'} · ${esc(h.s)}× <span class="qq">rule ${esc(h.rule)}×</span></span></div>`).join('')||'<p class="sub">No calls yet.</p>'}</div></div></div>
 <div class="grid g3" style="margin-top:14px">${[['Days scored',(sc.scored_days||0)],['Kronos, next hour',Object.entries(D.kronos||{}).map(([m,k])=>`${m} ${k.direction==='up'?'↑':'↓'}`).join(' ')||'–'],['Desk checked',D.checked?D.checked.slice(11,16)+' UTC':'–']]
   .map(([k,x])=>`<div class="card kpi rv"><div class="lb">${k}</div><div class="v num" style="font-size:24px">${esc(x)}</div></div>`).join('')}</div>
 <p class="src" style="margin-top:16px">Orbs: <a href="https://github.com/weeeha/AI-Orb">AI-Orb</a> by Nick Vyhouski (MIT licence). · <a href="desk.html">Open the 3D office</a></p>`;
 reveal(v);$$('.why',v).forEach(w=>w.onclick=()=>w.classList.toggle('open'));mountOrbs(v)}
// cards lean towards the pointer and catch the light (desktop only, one listener for the whole page)
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!reduce){let el=null,ev=null,pend=false;
 addEventListener('pointermove',e=>{ev=e;if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;const c=ev.target.closest&&ev.target.closest('.card');
  if(el&&el!==c){el.style.transform='';el.style.removeProperty('--mx')}el=c;if(!c)return;const r=c.getBoundingClientRect(),nx=(ev.clientX-r.left)/r.width,ny=(ev.clientY-r.top)/r.height;
  c.style.setProperty('--mx',(nx*100).toFixed(1)+'%');c.style.setProperty('--my',(ny*100).toFixed(1)+'%');
  if(c.classList.contains('tilt'))c.style.transform=`perspective(900px) rotateX(${((.5-ny)*7).toFixed(2)}deg) rotateY(${((nx-.5)*9).toFixed(2)}deg) translateZ(0)`})},{passive:true})}

route();
</script></body></html>
