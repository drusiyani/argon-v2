<style>
:root{--bg:#060606;--panel:#0F0F0F;--raise:#161616;--line:#242424;--line2:#1B1B1B;--ink:#ECE6D8;--muted:#9A9486;--faint:#8A8476;
--gold:#E6B54A;--gold2:#9C7A2E;--goldbg:rgba(230,181,74,.10);--up:#3FBF7F;--down:#D9584A;--upz:rgba(63,191,127,.13);--downz:rgba(217,88,74,.13);

--brand:"Source Serif 4","Exchange",Georgia,"Times New Roman",serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#060606;--panel:#0F0F0F;--raise:#161616;--line:#242424;--ink:#ECE6D8;--muted:#8B8577;--gold:#E6B54A}}
:root[data-theme="light"]{--bg:#F5F0E4;--panel:#FFFCF5;--raise:#EFE8D8;--line:#DDD3BE;--line2:#E8E0CE;--ink:#1B1810;--muted:#6E6656;--faint:#9C937F;
--gold:#9A6E12;--gold2:#C49A3E;--goldbg:rgba(154,110,18,.10);--up:#1E8A55;--down:#B63F33;--upz:rgba(30,138,85,.12);--downz:rgba(182,63,51,.12);
--blue:#2F62C8;--cyan:#1C8DA3;--violet:#8146B8;--purple:#5D53A3;--red:#B63F33;--grey:#8A8270}
:root[data-theme="dark"]{--bg:#060606;--panel:#0F0F0F;--raise:#161616;--line:#242424;--ink:#ECE6D8;--muted:#8B8577;--gold:#E6B54A}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root[data-mode="simple"] .adv{display:none!important}
:root[data-mode="advanced"] .simple-only{display:none!important}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.hero .h{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:16px}
.hero .n{font:500 40px/1 var(--mono);font-variant-numeric:tabular-nums}
.hero .l{font:500 17px var(--serif);margin-top:8px}.hero .s{font:12px var(--mono);color:var(--faint);margin-top:4px}
.tlist{display:flex;flex-direction:column}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.agent{border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--bg)}
.agent .e{line-height:0}
.say .mk{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px}.say .mk svg{width:16px;height:16px}.agent .nm{font:500 18px var(--serif);margin-top:6px}.agent .jb{font:13px/1.45 var(--serif);color:var(--muted);margin-top:4px}
.agent .st{font:11.5px var(--mono);color:var(--faint);margin-top:8px}
.score{display:grid;grid-template-columns:1fr auto auto;}
@media(max-width:560px){.score{grid-template-columns:1fr auto}.score .x{grid-column:1/-1;text-align:left;margin-top:-4px}}
.score{gap:6px 16px;align-items:baseline;font:14px var(--serif);border-top:1px solid var(--line2);padding-top:10px}
.score .v{font:500 16px var(--mono);text-align:right}.score .x{font:11.5px var(--mono);color:var(--faint);text-align:right}
.gframe{border:2px solid var(--gold);border-radius:6px;padding:10px;background:#050505;box-shadow:0 0 0 4px rgba(230,181,74,.08)}
:root[data-theme="light"] .gframe{background:linear-gradient(#FFFCF5,#FFFCF5) padding-box,linear-gradient(115deg,#C49A3E,#9A6E12,#E8C77A,#9A6E12,#C49A3E) border-box;background-size:100% 100%,300% 100%;box-shadow:0 0 0 4px rgba(154,110,18,.07)}
:root[data-theme="light"] .gtitle,:root[data-theme="light"] .grow b,:root[data-theme="light"] .gph,:root[data-theme="light"] .gcode b{color:#1B1810}
:root[data-theme="light"] .gsub,:root[data-theme="light"] .gday,:root[data-theme="light"] .gbig small,:root[data-theme="light"] .gcode{color:#6E6656}
:root[data-theme="light"] .gclock{color:#1B1810;border-color:#1B1810}
:root[data-theme="light"] .glogo{background:#F1EADB}
:root[data-theme="light"] .gcard,:root[data-theme="light"] .gpanel{background:#FFFFFF;border-color:#E6DDCB;border-left-color:var(--c)}
:root[data-theme="light"] .gpanel{border-left-color:#E6DDCB}
:root[data-theme="light"] .gn i,:root[data-theme="light"] .grow{color:#7A7262}
:root[data-theme="light"] .gtag{color:#7A7262;border-color:#E2D8C4}
:root[data-theme="light"] .gbar{background:#EFE7D6}
:root[data-theme="light"] .gq{color:#3A3427}
:root[data-theme="light"] .gstrip{border-color:#EAE2D1;color:var(--gold)}
:root[data-theme="light"] .gkv{color:#4A4436}
:root[data-theme="light"] .gpipe span{color:#4A4436;border-color:#E2D8C4}:root[data-theme="light"] .gpipe span.last{color:#fff}
:root[data-theme="light"] .gn b{filter:brightness(.82) saturate(1.1)}
:root[data-theme="light"] .gcard[data-ag="Chief"]{--c:#3A3427 !important}
:root[data-theme="light"] .gcard[data-ag="Chief"] .gn b{filter:none}
:root[data-theme="light"] .gcard[data-ag="Chief"] .gi svg,:root[data-theme="light"] .glogo svg{filter:drop-shadow(0 0 1px rgba(0,0,0,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.2))}
:root[data-theme="light"] .gi svg,:root[data-theme="light"] .glogo svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 4px 10px}
.glogo{line-height:0;background:#151515;border-radius:8px;padding:4px}.glogo svg{width:30px;height:30px}
.gtitle{font:700 25px/1 var(--brand);letter-spacing:-.02em;color:#F2EEE4;font-variation-settings:'opsz' 60}.gsub{font:500 10.5px var(--mono);letter-spacing:.14em;color:#8B8577}
.gsp{flex:1}.gday{font:500 11px var(--mono);letter-spacing:.12em;color:#8B8577}
.gclock{font:600 19px var(--mono);color:#F2EEE4;border:1.5px solid #F2EEE4;border-radius:4px;padding:3px 10px;letter-spacing:.06em}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:900px){.ggrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){:root[data-mode="simple"] .gcard .gq,:root[data-mode="simple"] .gcard .gn i{display:none}:root[data-mode="simple"] .gcard{padding:8px}}
.gcard{background:#0d0d0d;border:1px solid #232323;border-left:3px solid var(--c);border-radius:4px;padding:9px 10px 8px;cursor:pointer;min-width:0}
.gcard:focus-visible,.gcard:hover{border-color:var(--c)}
.gt{display:flex;align-items:flex-start;gap:8px}.gi{line-height:0;flex:none}.gi svg{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.gn{display:flex;flex-direction:column;min-width:0;flex:1}.gn b{font:800 17px/1.1 var(--mono);color:var(--c);letter-spacing:.01em}.gn i{font:400 10px/1.3 var(--mono);color:#8E8879;font-style:normal;margin-top:2px}
.gtag{font:600 8.5px var(--mono);letter-spacing:.08em;color:#8B8577;border:1px solid #2A2A2A;border-radius:3px;padding:1px 5px;flex:none}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:9px;font:10.5px var(--mono);color:#8E8879}.grow b{font:700 15px var(--mono);color:#F2EEE4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{height:3px;background:#1E1E1E;margin-top:4px;border-radius:2px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--c)}
.gq{font:11px/1.35 var(--mono);color:#D9D3C5;margin-top:6px;min-height:15px}
.gstrip{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--gold);text-align:center;padding:9px 4px;border-top:1px solid #1E1E1E;border-bottom:1px solid #1E1E1E;margin:10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbottom{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}@media(max-width:900px){.gbottom{grid-template-columns:1fr}}
.gpanel{background:#0d0d0d;border:1px solid #232323;border-radius:4px;padding:10px 12px}
.gph{display:flex;justify-content:space-between;gap:8px;font:600 10.5px var(--mono);letter-spacing:.1em;color:#F2EEE4;margin-bottom:8px}
.gbal{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}@media(max-width:560px){.gbal{grid-template-columns:1fr}}
.gbig{display:flex;flex-direction:column;gap:3px}.gbig small{font:10.5px var(--mono);color:#8B8577}.gbig b{font:700 24px var(--mono)}
.gcode{font:11.5px/1.6 var(--mono);color:#8B8577;margin-bottom:6px}.gcode b{color:#F2EEE4}
.gkv{display:flex;justify-content:space-between;padding-left:14px;color:#BDB6A6}.gkv span:last-child{color:var(--gold)}
.gpipe{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:10.5px var(--mono)}.gpipe span{border:1px solid #2A2A2A;border-radius:3px;padding:2px 6px;color:#BDB6A6}.gpipe span.last{background:var(--gold);color:#060606;border-color:var(--gold);font-weight:700}.gpipe i{color:#5D584E;font-style:normal}
.say{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:6px 0;font:14px/1.5 var(--serif)}.say b{font-family:var(--mono);font-size:12px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.trow:hover{background:var(--raise)}
.trow .w{font:15px var(--serif)}.trow .w small{display:block;font:11.5px var(--mono);color:var(--faint)}
.trow .r{font:500 16px var(--mono)}
.tag2{font:11px var(--mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.tag2.buy{color:var(--up);border-color:rgba(63,191,127,.4)}.tag2.sell{color:var(--down);border-color:rgba(217,88,74,.4)}
details.why{margin-top:12px;border-top:1px solid var(--line2);padding-top:8px}
details.why>summary{cursor:pointer;font:500 12px var(--mono);color:var(--gold);letter-spacing:.06em;list-style:none}
details.why>summary::before{content:"▸ "}details.why[open]>summary::before{content:"▾ "}
.simplewhy{font:15px/1.55 var(--serif);color:var(--ink);margin:10px 0 4px}
@media(max-width:700px){.hstat .x{display:none}.hb{padding:8px 14px}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.hb{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding:10px 18px;max-width:1500px;margin:0 auto}
.brand{display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap;text-decoration:none}.brand svg{color:var(--gold)}
.brand b{font:700 25px/1 var(--brand);letter-spacing:-.02em;font-variation-settings:'opsz' 60}.brand em{font:700 10.5px var(--mono);font-style:normal;color:#060606;background:var(--gold);border-radius:20px;padding:2px 7px;margin-left:2px}
nav{display:flex;gap:4px}
nav button{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:5px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--gold);background:var(--goldbg)}
.hstat{margin-left:auto;font:11.5px var(--mono);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hstat .dot{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px}
.tbtn{font:11.5px var(--mono);background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 8px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main>section[hidden]{display:none}
.page{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
h1{font:500 34px/1.15 var(--serif);margin:6px 0 10px;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:64ch;margin:0 0 16px;font:17px/1.6 var(--serif)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:12px 12px 10px}
.tile .n{font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .n.g{color:var(--gold)}
.tile .l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.tile .s{font:11px var(--mono);color:var(--faint);margin-top:3px;line-height:1.35}
.legendline{display:flex;flex-wrap:wrap;gap:6px 18px;font:11.5px var(--mono);color:var(--muted);margin:12px 0 18px}
.legendline b{color:var(--ink);font-weight:600;margin-right:6px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:16px;margin:14px 0}
.ct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ct h2{font:500 20px var(--serif);margin:0}
.ct .sub{font:11.5px var(--mono);color:var(--muted)}
.ct .sub b{color:var(--gold);font-weight:500}
table{border-collapse:collapse;width:100%;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--gold);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.r,th.r{text-align:right}
.pos{color:var(--up)}.neg{color:var(--down)}.dim{color:var(--muted)}.gold{color:var(--gold)}
.scroll{overflow-x:auto}
.callout{border-left:2px solid var(--gold);background:var(--goldbg);padding:10px 14px;border-radius:0 6px 6px 0;font:12px/1.55 var(--mono);color:var(--ink);margin:12px 0}
.cov{overflow-x:auto;padding-bottom:6px}
.covgrid{display:grid;gap:3px;align-items:center}
.cell{width:16px;height:16px;border-radius:2px;background:var(--line2);cursor:pointer;border:0;padding:0}
.covlab{font:11px var(--mono);color:var(--muted);padding-right:8px}
.vgroup{font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);margin:16px 0 8px;text-transform:uppercase}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px}
.vk{font:600 12.5px var(--mono)}.vk .c{color:var(--faint);font-weight:400;margin-left:6px}
.vd{font:14.5px/1.55 var(--serif);color:var(--muted);margin-top:4px}
.dotk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}
.race{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.racer{border:1px solid var(--line);border-radius:8px;padding:12px}
.racer .n{font:500 24px var(--mono)}
.plain{font:15px/1.6 var(--serif);color:var(--muted);max-width:68ch;margin:6px 0 12px}
.racer .l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.racer .s{font:11.5px var(--mono);color:var(--muted);margin-top:4px}
/* v1 elements */
.chips1{display:flex;flex-wrap:wrap;gap:4px 14px;font:11.5px var(--mono);color:var(--muted)}
.chips1 span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chips1 i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.chips1 i.g{background:var(--gold)}.chips1 i.off{background:var(--faint)}
.banner{border:1px solid rgba(230,181,74,.35);background:var(--goldbg);border-radius:10px;padding:14px 18px;margin:16px 0;font:17px/1.6 var(--serif);max-width:820px}
.banner b{color:var(--gold);font-weight:600}
.mkts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.mkt{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px}

.mkt .p{font:500 18px var(--mono);margin-top:4px}.mkt .c{font:12px var(--mono)}
.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.bot{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}

.bot .ft{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--faint);margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.crit li{margin:6px 0}.crit .st{font:11px var(--mono);color:var(--faint);margin-left:6px}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.fstep{border:1px solid var(--line2);border-radius:8px;padding:12px;background:var(--panel)}
.fstep .n{font:500 30px var(--serif)}.fstep .l{font:11px var(--mono);color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.badge2{font:11px var(--mono);padding:2px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.badge2.pass{color:var(--up);border-color:var(--up)}.badge2.fail{color:var(--down);border-color:rgba(217,88,74,.5)}.badge2.wait{color:var(--gold);border-color:rgba(230,181,74,.5)}
.dials{font:11.5px var(--mono);color:var(--muted);white-space:normal;min-width:300px;max-width:420px}
.imp{display:grid;grid-template-columns:110px 1fr;gap:4px 14px;font:12px var(--mono);align-items:center}
.imp .vals{display:flex;flex-wrap:wrap;gap:6px}
.imp .v{border:1px solid var(--line2);border-radius:6px;padding:3px 8px}.imp .v.best{border-color:var(--gold);color:var(--gold)}
/* chart */
#chart{max-width:none}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line2);font:12px var(--mono);color:var(--muted)}
